<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0d7a74">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="FichaMed">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" href="icon-192.png">
  <title>FichaMed · Fichas técnicas AEMPS</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --card-alt: #f1f5f9;
      --tx: #0f172a;
      --mu: #64748b;
      --bd: #e2e8f0;
      --ac: #0d7a74;
      --ac-hover: #085a56;
      --ac2: #e6f6f5;
      --ac2-border: #bceae7;
      --wa: #fefce8;
      --wat: #854d0e;
      --wab: #fef08a;
      --er: #fef2f2;
      --ert: #991b1b;
      --erb: #fecaca;
      --hl: #fde047;
      --fav: #eab308;
      --fav-bg: #fef9c3;
      --sh: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      --sh-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.07), 0 4px 6px -4px rgba(0, 0, 0, 0.05);
      --radius: 12px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b0f14;
        --card: #151b23;
        --card-alt: #1c2430;
        --tx: #f1f5f9;
        --mu: #94a3b8;
        --bd: #263242;
        --ac: #38bdf8;
        --ac-hover: #7dd3fc;
        --ac2: #102a3a;
        --ac2-border: #1e4963;
        --wa: #2c2207;
        --wat: #fde047;
        --wab: #634d0b;
        --er: #2f1214;
        --ert: #fca5a5;
        --erb: #682329;
        --hl: #614d0d;
        --fav: #facc15;
        --fav-bg: #422006;
        --sh: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        --sh-lg: 0 10px 20px -3px rgba(0, 0, 0, 0.4);
      }
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 15px;
      line-height: 1.6;
      background: var(--bg);
      color: var(--tx);
      -webkit-font-smoothing: antialiased;
    }

    header {
      background: var(--card);
      border-bottom: 1px solid var(--bd);
      position: sticky;
      top: 0;
      z-index: 20;
      padding: max(14px, env(safe-area-inset-top)) 24px 14px;
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.03);
    }

    .header-inner {
      max-width: 1300px;
      margin: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    h1 {
      font-size: 20px;
      margin: 0;
      font-weight: 700;
      letter-spacing: -0.3px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    h1 span { color: var(--ac); }
    h1 small { font-weight: 400; font-size: 13px; color: var(--mu); }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-tab {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid var(--bd);
      border-radius: 8px;
      background: var(--bg);
      color: var(--tx);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-tab:hover {
      background: var(--card-alt);
      border-color: var(--mu);
    }

    .btn-tab.active {
      background: var(--ac);
      color: #ffffff;
      border-color: var(--ac);
    }

    .btn-tab .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      border-radius: 9px;
      font-size: 11px;
      background: rgba(0, 0, 0, 0.12);
      color: inherit;
    }

    .btn-tab.active .badge {
      background: rgba(255, 255, 255, 0.25);
    }

    .search-row {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .search-wrapper {
      position: relative;
      flex: 1;
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--mu);
      pointer-events: none;
      display: flex;
      align-items: center;
    }

    #q {
      width: 100%;
      padding: 13px 16px 13px 44px;
      font-size: 15px;
      border: 1px solid var(--bd);
      border-radius: var(--radius);
      background: var(--bg);
      color: var(--tx);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.02);
    }

    #q:focus {
      outline: none;
      border-color: var(--ac);
      box-shadow: 0 0 0 3px var(--ac2);
      background: var(--card);
    }

    .mascot-avatar {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      border: 2.5px solid var(--ac);
      background: #ffffff;
      box-shadow: var(--sh);
      overflow: hidden;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.25s ease;
      cursor: pointer;
    }

    .mascot-avatar:hover {
      transform: scale(1.15) rotate(5deg);
      box-shadow: var(--sh-lg);
    }

    .mascot-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 18%;
      display: block;
    }

    main {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 24px;
      padding: 24px;
      max-width: 1300px;
      margin: auto;
      min-height: calc(100vh - 130px);
    }

    @media (max-width: 880px) {
      main {
        grid-template-columns: 1fr;
        padding: 16px;
        gap: 16px;
      }
      .mascot-avatar {
        width: 54px;
        height: 54px;
      }
      .header-top {
        flex-wrap: wrap;
      }
    }

    .card {
      background: var(--card);
      border: 1px solid var(--bd);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: var(--sh);
      position: relative;
    }

    .card-head-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .actions-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #res {
      max-height: calc(100vh - 170px);
      overflow-y: auto;
      padding-right: 4px;
    }

    @media (max-width: 880px) {
      #res { max-height: none; overflow-y: visible; }
    }

    #res .it {
      padding: 14px;
      border: 1px solid var(--bd);
      border-radius: 10px;
      margin-bottom: 10px;
      cursor: pointer;
      background: var(--card);
      transition: all 0.15s ease-in-out;
      box-shadow: 0 1px 2px rgba(0,0,0,0.02);
      position: relative;
    }

    #res .it:hover {
      border-color: var(--ac);
      transform: translateY(-1px);
      box-shadow: var(--sh);
    }

    #res .it.on {
      border-color: var(--ac);
      background: var(--ac2);
    }

    #res .it.on::before {
      content: '';
      position: absolute;
      left: 0;
      top: 8px;
      bottom: 8px;
      width: 4px;
      background: var(--ac);
      border-radius: 0 4px 4px 0;
    }

    .it-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }

    .it b {
      display: block;
      font-size: 14.5px;
      font-weight: 600;
      line-height: 1.35;
      color: var(--tx);
      margin-bottom: 4px;
    }

    .it small {
      color: var(--mu);
      font-size: 12.5px;
      line-height: 1.4;
      display: block;
    }

    .it-offline-tag {
      font-size: 11px;
      color: var(--fav);
      font-weight: bold;
      white-space: nowrap;
    }

    .tag-container {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 12px 0;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      font-size: 12px;
      font-weight: 500;
      padding: 3px 10px;
      border-radius: 20px;
      background: var(--ac2);
      color: var(--ac);
      border: 1px solid var(--ac2-border);
      line-height: 1.4;
    }

    .tag.w {
      background: var(--wa);
      color: var(--wat);
      border-color: var(--wab);
    }

    .tag.offline {
      background: var(--fav-bg);
      color: var(--wat);
      border-color: var(--wab);
      font-weight: 600;
    }

    h2 {
      font-size: 18px;
      margin: 0;
      color: var(--ac);
      font-weight: 700;
      letter-spacing: -0.2px;
    }

    .txt {
      white-space: pre-wrap;
      font-size: 14px;
      line-height: 1.65;
      color: var(--tx);
    }

    mark {
      background: var(--hl);
      color: inherit;
      padding: 1px 4px;
      border-radius: 4px;
      font-weight: 500;
    }

    .warn {
      background: var(--wa);
      border: 1px solid var(--wab);
      border-radius: var(--radius);
      padding: 14px 16px;
      margin-bottom: 16px;
      font-size: 13.5px;
      color: var(--wat);
      box-shadow: 0 1px 2px rgba(0,0,0,0.02);
    }

    .err {
      background: var(--er);
      border: 1px solid var(--erb);
      border-radius: var(--radius);
      padding: 14px 16px;
      color: var(--ert);
      font-size: 14px;
      margin-bottom: 16px;
    }

    details {
      border: 1px solid var(--bd);
      border-radius: 10px;
      margin-bottom: 10px;
      background: var(--card);
      overflow: hidden;
      transition: border-color 0.15s ease;
    }

    details:hover {
      border-color: #cbd5e1;
    }

    details[open] {
      border-color: var(--bd);
      box-shadow: var(--sh);
    }

    summary {
      cursor: pointer;
      padding: 12px 16px;
      font-weight: 600;
      font-size: 14.5px;
      user-select: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
      list-style: none;
      background: var(--card);
    }

    summary::-webkit-details-marker {
      display: none;
    }

    summary::after {
      content: '+';
      font-size: 16px;
      font-weight: 400;
      color: var(--mu);
    }

    details[open] summary::after {
      content: '−';
      font-size: 16px;
    }

    details[open] summary {
      border-bottom: 1px solid var(--bd);
      background: var(--card-alt);
    }

    details .txt {
      padding: 14px 16px;
    }

    a {
      color: var(--ac);
      text-decoration: none;
      font-weight: 500;
    }

    a:hover {
      text-decoration: underline;
    }

    .mu { color: var(--mu); }

    .empty {
      padding: 48px 16px;
      text-align: center;
      color: var(--mu);
      font-size: 14px;
    }

    .kv {
      display: grid;
      grid-template-columns: 140px 1fr;
      gap: 8px 12px;
      font-size: 13.5px;
      background: var(--card-alt);
      padding: 12px 14px;
      border-radius: 8px;
    }

    .kv div:nth-child(odd) {
      color: var(--mu);
      font-weight: 500;
    }

    button.cp, button.btn-save {
      font-size: 12px;
      font-weight: 500;
      border: 1px solid var(--bd);
      background: var(--card);
      color: var(--tx);
      border-radius: 6px;
      padding: 6px 12px;
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    button.cp:hover, button.btn-save:hover {
      background: var(--bg);
      border-color: var(--mu);
    }

    button.btn-save.saved {
      background: var(--fav-bg);
      color: var(--wat);
      border-color: var(--wab);
      font-weight: 600;
    }

    button.cp:active, button.btn-save:active {
      transform: scale(0.97);
    }

    #det { scroll-margin-top: 100px; }

    @media(max-width:850px){
      .kv { grid-template-columns: 110px 1fr; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="header-top">
      <h1>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--ac)"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/><path d="M12 5v14"/><path d="M5 12h14"/></svg>
        Ficha<span>Med</span>
        <small>· fichas técnicas AEMPS (CIMA)</small>
      </h1>
      <div class="header-actions">
        <button id="btn-tab-search" class="btn-tab active" onclick="switchTab('search')">
          🔍 Buscar
        </button>
        <button id="btn-tab-saved" class="btn-tab" onclick="switchTab('saved')">
          ⭐ Guardados <span id="saved-count" class="badge">0</span>
        </button>
      </div>
    </div>
    <div class="search-row">
      <div class="search-wrapper">
        <div class="search-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        </div>
        <input id="q" placeholder="Nombre comercial o principio activo (ej. vancomicina, Augmentin, amiodarona…)" autofocus>
      </div>
      <div class="mascot-avatar" title="Dr. Dog a su servicio!">
        <img src="doctor-perro.png" alt="Dr. Dog">
      </div>
    </div>
  </div>
</header>

<main>
  <section id="res">
    <div class="empty">Escribe al menos 2 letras para buscar.</div>
  </section>
  <section id="det">
    <div class="empty">Selecciona un medicamento para ver su información.</div>
  </section>
</main>

<script>
const $=s=>document.querySelector(s);
const KW=/(suero\w*|cloruro s[óo]dico|cloruro de sodio|NaCl|glucosa\w*|dextrosa|fisiol[óo]gic\w*|Ringer|lactato|agua para (?:inyecci[óo]n|preparaciones inyectables)|dilu\w+|reconstitu\w+|incompatib\w+|compatib\w+|no (?:debe|debe[n]?) (?:mezclarse|administrarse)\w*|mezcl\w+|perfusi[óo]n\w*|infusi[óo]n\w*|bolo|\d+(?:[.,]\d+)?\s?(?:ml|mL|ML|l|L)\b|\d+(?:[.,]\d+)?\s?(?:mg\/ml|mg\/mL|mcg\/ml|g\/l)|minutos?|horas?|pH)/gi;
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const hl=(s,on=true)=>on?esc(s).replace(KW,'<mark>$1</mark>'):esc(s);
let t,cur;
let currentTab = 'search';

$('#q').addEventListener('input',e=>{
  if(currentTab !== 'search') switchTab('search', false);
  clearTimeout(t);
  t=setTimeout(()=>buscar(e.target.value),350)
});

const CIMA='https://cima.aemps.es/cima/rest';
const SECC={"4.1":"Indicaciones terapéuticas","4.2":"Posología y forma de administración","4.3":"Contraindicaciones","4.4":"Advertencias y precauciones","4.5":"Interacciones","4.6":"Fertilidad, embarazo y lactancia","4.9":"Sobredosis","6.1":"Lista de excipientes","6.2":"Incompatibilidades","6.3":"Periodo de validez","6.4":"Precauciones especiales de conservación","6.6":"Precauciones especiales de eliminación y otras manipulaciones"};
const BLOQUE=["6.2","6.6","6.3"];
const memo={};
const PROXY='';

// --- GESTIÓN DE GUARDADOS OFFLINE (LOCALSTORAGE) ---
const STORAGE_KEY = 'fichamed_saved_meds';

function getSavedMeds() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch (e) {
    return {};
  }
}

function updateSavedCountBadge() {
  const saved = getSavedMeds();
  const count = Object.keys(saved).length;
  const badge = $('#saved-count');
  if (badge) badge.innerText = count;
}

function toggleSaveCurrent() {
  if (!cur || !cur.info || !cur.info.nregistro) return;
  const n = String(cur.info.nregistro);
  const saved = getSavedMeds();
  const btn = $('#btn-save-current');
  
  if (saved[n]) {
    delete saved[n];
    localStorage.setItem(STORAGE_KEY, JSON.stringify(saved));
    if (btn) {
      btn.classList.remove('saved');
      btn.innerHTML = '⭐ Guardar offline';
    }
  } else {
    saved[n] = {
      timestamp: Date.now(),
      data: cur
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(saved));
    if (btn) {
      btn.classList.add('saved');
      btn.innerHTML = '★ Guardado offline';
    }
  }
  updateSavedCountBadge();
  if (currentTab === 'saved') renderSavedList();
}

function switchTab(tab, focusSearch = true) {
  currentTab = tab;
  $('#btn-tab-search').classList.toggle('active', tab === 'search');
  $('#btn-tab-saved').classList.toggle('active', tab === 'saved');

  if (tab === 'saved') {
    renderSavedList();
  } else {
    const qVal = $('#q').value;
    if (qVal.trim().length >= 2) {
      buscar(qVal);
    } else {
      $('#res').innerHTML = '<div class="empty">Escribe al menos 2 letras para buscar.</div>';
    }
    if (focusSearch) $('#q').focus();
  }
}

function renderSavedList() {
  const saved = getSavedMeds();
  const keys = Object.keys(saved);
  if (!keys.length) {
    $('#res').innerHTML = '<div class="empty">No tienes medicamentos guardados todavía.<br><br>Abre cualquier fármaco con internet y pulsa <b>⭐ Guardar offline</b> para consultarlo sin cobertura cuando quieras.</div>';
    return;
  }

  // Ordenar por guardado más reciente
  const items = keys.map(k => saved[k]).sort((a,b) => (b.timestamp||0) - (a.timestamp||0));
  $('#res').innerHTML = items.map(entry => {
    const m = entry.data.info;
    const isCurrent = cur && String(cur.info.nregistro) === String(m.nregistro);
    return `<div class="it ${isCurrent ? 'on' : ''}" data-n="${m.nregistro}" onclick="abrirOffline('${m.nregistro}', this)">
      <div class="it-top">
        <b>${esc(m.nombre||'')}</b>
        <span class="it-offline-tag">★ Offline</span>
      </div>
      <small>${esc(m.forma||'')} · ${esc((m.vias||[]).join(', '))}<br>${esc(m.labtitular||'')}</small>
    </div>`;
  }).join('');
}

function abrirOffline(n, el) {
  document.querySelectorAll('.it').forEach(x => x.classList.remove('on'));
  if (el) el.classList.add('on');
  const saved = getSavedMeds();
  if (saved[n] && saved[n].data) {
    cur = saved[n].data;
    pintar(cur, true);
    if (innerWidth < 850) $('#det').scrollIntoView({behavior:'smooth'});
    else window.scrollTo({top:0, behavior:'smooth'});
  }
}

async function cj(path,params){
 const qs=new URLSearchParams(params||{}).toString();
 const rutas=[CIMA+path+(qs?'?'+qs:'')];
 if(PROXY)rutas.push(PROXY+path+(qs?'?'+qs:''));
 const key=rutas[0];if(memo[key])return memo[key];
 let r=null;
 for(const u of rutas){
  try{r=await fetch(u,{headers:{Accept:'application/json'}});break}catch(e){}
 }
 if(!r)throw new Error('Sin conexión con CIMA. Si no tienes internet, revisa tus medicamentos guardados en la pestaña "⭐ Guardados".');
 if(!r.ok)throw new Error('CIMA respondió con error '+r.status);
 const d=await r.json();memo[key]=d;return d}

function htmlTexto(html){
 const doc=new DOMParser().parseFromString(html||'','text/html');
 doc.querySelectorAll('br').forEach(b=>b.replaceWith('\n'));
 doc.querySelectorAll('li').forEach(e=>e.prepend('• '));
 doc.querySelectorAll('td,th').forEach(e=>e.append(' | '));
 doc.querySelectorAll('p,div,li,tr,h1,h2,h3,h4,h5,h6,table,ul,ol').forEach(e=>{e.prepend('\n');e.append('\n')});
 return (doc.body.textContent||'').replace(/\u00a0/g,' ').split('\n')
  .map(l=>l.replace(/[ \t]+/g,' ').trim().replace(/(\s*\|\s*)+$/,'')).filter(Boolean).join('\n')}

const cmpSec=(a,b)=>{const x=a.split('.').map(Number),y=b.split('.').map(Number);for(let i=0;i<Math.max(x.length,y.length);i++){const d=(x[i]||0)-(y[i]||0);if(d)return d}return 0};

function agrupar(secs,k){return Object.keys(secs).sort(cmpSec).filter(s=>s===k||s.startsWith(k+'.')).map(s=>secs[s].texto).filter(Boolean).join('\n')}

async function apiBuscar(q){
 const vistos=new Set(),out=[];
 for(const p of [{nombre:q},{practiv1:q}]){
  let d;try{d=await cj('/medicamentos',{...p,comerc:1,tamanioPagina:25})}catch(e){if(!out.length&&p.practiv1)throw e;continue}
  for(const m of d.resultados||[]){if(vistos.has(m.nregistro))continue;vistos.add(m.nregistro);
   out.push({nregistro:m.nregistro,nombre:m.nombre,labtitular:m.labtitular,dosis:m.dosis,
    forma:(m.formaFarmaceuticaSimplificada||m.formaFarmaceutica||{}).nombre,vias:(m.viasAdministracion||[]).map(v=>v.nombre)})}}
 return {resultados:out.slice(0,40)}}

async function apiMed(n){
 // Comprobar si ya lo tenemos guardado offline
 const saved = getSavedMeds();
 if (saved[n] && saved[n].data) return saved[n].data;

 const m=await cj('/medicamento',{nregistro:n});
 let data=await cj('/docSegmentado/contenido/1',{nregistro:n});
 if(!Array.isArray(data))data=data.secciones||data.resultados||[data];
 const secs={};for(const s of data){const k=String(s.seccion||'').trim();if(k)secs[k]={titulo:(s.titulo||'').trim(),texto:htmlTexto(s.contenido)}}
 const info={nregistro:m.nregistro,nombre:m.nombre,labtitular:m.labtitular,dosis:m.dosis,receta:m.receta,generico:m.generico,biosimilar:m.biosimilar,huerfano:m.huerfano,triangulo:m.triangulo,psum:m.psum,notas:m.notas,materialesInf:m.materialesInf,
  forma:(m.formaFarmaceutica||{}).nombre,vias:(m.viasAdministracion||[]).map(v=>v.nombre),
  pactivos:(m.principiosActivos||[]).map(p=>({nombre:p.nombre,cantidad:p.cantidad,unidad:p.unidad})),
  atc:(m.atcs||[]).map(a=>({codigo:a.codigo,nombre:a.nombre})),
  url_ficha:'https://cima.aemps.es/cima/dochtml/ft/'+n+'/FichaTecnica.html',url_cima:'https://cima.aemps.es/cima/publico/detalle.html?nregistro='+n};
 const bloques={};for(const k in SECC)bloques[k]={titulo:SECC[k],texto:agrupar(secs,k)};
 return {info,secciones:bloques,bloque_dilucion:BLOQUE,n_secciones_recibidas:Object.keys(secs).length}}

async function j(u){
 const url=new URL(u,'http://x');
 if(url.pathname==='/api/buscar')return apiBuscar(url.searchParams.get('q')||'');
 if(url.pathname==='/api/med')return apiMed((url.searchParams.get('nregistro')||'').replace(/\D/g,''));
 throw new Error('ruta desconocida')}

async function buscar(q){
 if(q.trim().length<2){$('#res').innerHTML='<div class="empty">Escribe al menos 2 letras.</div>';return}
 $('#res').innerHTML='<div class="empty">Buscando en CIMA…</div>';
 try{
  const d=await j('/api/buscar?q='+encodeURIComponent(q));
  if(!d.resultados.length){$('#res').innerHTML='<div class="empty">Sin resultados comercializados.</div>';return}
  const saved = getSavedMeds();
  $('#res').innerHTML=d.resultados.map(m=>{
    const isSaved = !!saved[String(m.nregistro)];
    return `<div class="it" data-n="${m.nregistro}">
      <div class="it-top">
        <b>${esc(m.nombre||'')}</b>
        ${isSaved ? '<span class="it-offline-tag">★ Guardado</span>' : ''}
      </div>
      <small>${esc(m.forma||'')} · ${esc((m.vias||[]).join(', '))}<br>${esc(m.labtitular||'')}</small>
    </div>`;
  }).join('');
  document.querySelectorAll('.it').forEach(el=>el.onclick=()=>abrir(el.dataset.n,el));
 }catch(e){
  const saved = getSavedMeds();
  const count = Object.keys(saved).length;
  let offlineMsg = `<div class="err">${esc(e.message)}</div>`;
  if (count > 0) {
    offlineMsg += `<div class="warn" style="cursor:pointer" onclick="switchTab('saved')">💡 Tienes <b>${count} medicamento(s)</b> guardados para consulta sin internet. Haz clic aquí para verlos.</div>`;
  }
  $('#res').innerHTML=offlineMsg;
 }
}

async function abrir(n,el){
 document.querySelectorAll('.it').forEach(x=>x.classList.remove('on'));el&&el.classList.add('on');
 $('#det').innerHTML='<div class="empty">Cargando ficha técnica…</div>';
 try{
  const d=await j('/api/med?nregistro='+n);
  cur=d;
  pintar(d);
  if(innerWidth<850)$('#det').scrollIntoView({behavior:'smooth'});
  else window.scrollTo({top:0,behavior:'smooth'});
 }catch(e){
  // Si falla la red, intentar abrir desde guardados
  const saved = getSavedMeds();
  if (saved[n] && saved[n].data) {
    cur = saved[n].data;
    pintar(cur, true);
  } else {
    $('#det').innerHTML=`<div class="err">${esc(e.message)}</div>`;
  }
 }
}

function sec(d,k,open,hlOn=true){const s=d.secciones[k];
 if(!s||!s.texto)return`<details><summary>${k} · ${esc(s?s.titulo:k)} <span class="mu">— no disponible</span></summary></details>`;
 return`<details ${open?'open':''}><summary>${k} · ${esc(s.titulo)}</summary><div class="txt">${hl(s.texto,hlOn)}</div></details>`}

function pintar(d, isFromOffline=false){
 const i=d.info,tags=[];
 if(i.receta)tags.push('<span class="tag">Con receta</span>');
 if(i.generico)tags.push('<span class="tag">EFG / genérico</span>');
 if(i.biosimilar)tags.push('<span class="tag">Biosimilar</span>');
 if(i.triangulo)tags.push('<span class="tag w">▼ Seguimiento adicional</span>');
 if(i.psum)tags.push('<span class="tag w">Problema de suministro</span>');
 if(i.notas)tags.push('<span class="tag w">Notas de seguridad AEMPS</span>');
 if(i.materialesInf)tags.push('<span class="tag w">Materiales informativos</span>');
 if(i.huerfano)tags.push('<span class="tag">Huérfano</span>');

 const saved = getSavedMeds();
 const isSaved = !!saved[String(i.nregistro)];
 if (isSaved || isFromOffline) {
   tags.push('<span class="tag offline">★ Disponible sin conexión</span>');
 }

 const dil=d.bloque_dilucion.map(k=>d.secciones[k]).filter(s=>s&&s.texto);
 let h=`<div class="card">
 <div class="card-head-actions">
   <h2>${esc(i.nombre)}</h2>
   <div class="actions-group">
     <button id="btn-save-current" class="btn-save ${isSaved ? 'saved' : ''}" onclick="toggleSaveCurrent()">
       ${isSaved ? '★ Guardado offline' : '⭐ Guardar offline'}
     </button>
   </div>
 </div>
 <div class="tag-container">${tags.join('')}</div>
 <div class="kv"><div>Principio(s) activo(s)</div><div>${i.pactivos.map(p=>esc(p.nombre)+(p.cantidad?' '+esc(p.cantidad)+' '+esc(p.unidad||''):'')).join('; ')}</div>
 <div>Forma farmacéutica</div><div>${esc(i.forma||'—')}</div><div>Vía(s)</div><div>${esc((i.vias||[]).join(', ')||'—')}</div>
 <div>Titular</div><div>${esc(i.labtitular||'—')}</div><div>ATC</div><div>${i.atc.map(a=>esc(a.codigo+' '+a.nombre)).join(' · ')||'—'}</div>
 <div>Nº registro</div><div>${i.nregistro} · <a href="${i.url_ficha}" target="_blank" rel="noopener">Ficha original</a> · <a href="${i.url_cima}" target="_blank" rel="noopener">CIMA</a></div></div></div>`;
 if(!d.n_secciones_recibidas)h+=`<div class="err">CIMA no devolvió el contenido segmentado de la ficha técnica. Consulta la ficha original.</div>`;
 h+=`<div class="warn">⚠️ Texto literal de la ficha técnica, con palabras clave resaltadas automáticamente (no es un resumen ni una interpretación). Contrasta siempre con la ficha original y con el servicio de farmacia antes de preparar o administrar. Si la ficha no menciona una dilución concreta, <b>no implica que esté permitida</b>.</div>`;
 h+=`<div class="card" style="border-left: 4px solid var(--ac);"><button class="cp" onclick="cp()">📋 Copiar</button><h2>💧 Preparación, dilución y compatibilidad</h2>`;
 if(dil.length)h+=dil.map(s=>`<p style="margin:12px 0 4px;font-weight:600">${esc(s.titulo)}</p><div class="txt">${hl(s.texto)}</div>`).join('');
 else h+='<p class="mu">Las secciones 6.2, 6.3 y 6.6 están vacías o no disponibles.</p>';
 h+=`<p style="margin:16px 0 4px;font-weight:600">Posología y forma de administración (4.2) <span class="mu" style="font-weight:normal">— vía, velocidad y diluyentes</span></p>`;
 h+=d.secciones['4.2'].texto?`<div class="txt">${hl(d.secciones['4.2'].texto)}</div>`:'<p class="mu">No disponible.</p>';
 h+='</div>';
 h+=['4.1','4.3','4.4','4.5','4.6','4.9','6.1','6.4'].map(k=>sec(d,k,k==='4.5')).join('');
 $('#det').innerHTML=h;
}

function cp(){
 if(!cur)return;const i=cur.info,s=cur.secciones;
 const t=[i.nombre,'Nº registro '+i.nregistro,'',...cur.bloque_dilucion.map(k=>s[k]&&s[k].texto?s[k].titulo+'\n'+s[k].texto:''),'4.2 '+(s['4.2'].texto||''),'','Fuente: '+i.url_ficha].join('\n');
 navigator.clipboard.writeText(t);
 const btn=$('.cp');
 if(btn){btn.innerText='✓ ¡Copiado!';setTimeout(()=>btn.innerText='📋 Copiar',1500)}
}
